<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My First Form</title>
   <link rel="stylesheet" href="./index.css">
</head>

<body>
   <form class="registration-form">
      <div class="heading-container">
         <h3 class="form-heading">
            Registration Form
         </h3>
      </div>
      <div class="form-body">
         <section class="form-body-child-section">
            <h4 class="form-sub-heading">
               Personal Details
            </h4>
            <div class="form-input-fields-contiainer">
               <div class="form-input-with-label-conatiner">
                  <label for="full-name" class="form-label">Full Name</label>
                  <input type="text" class="form-input-field" placeholder="Enter your name" name="full-name">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="date-of-birth" class="form-label">Date of Birth</label>
                  <input type="date" class="form-input-field" placeholder="Enter birth date" name="date-of-birth">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-input-field" placeholder="Enter your email" name="email">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="mobile-number" class="form-label">Mobile Number</label>
                  <input type="tel" class="form-input-field" placeholder="Enter mobile number" name="mobile-number">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="gender" class="form-label">Gender</label>
                  <input type="text" class="form-input-field" placeholder="Enter your Gender" name="gender">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="occupation" class="form-label">Occupation</label>
                  <input type="text" class="form-input-field" placeholder="Enter occupation" name="occupation">
               </div>
            </div>
         </section>
         <section class="form-body-child-section">
            <h4 class="form-sub-heading">
               Identity Details
            </h4>
            <div class="form-input-fields-contiainer">
               <div class="form-input-with-label-conatiner">
                  <label for="id-type" class="form-label">ID Type</label>
                  <input type="text" class="form-input-field" placeholder="Enter ID type" name="id-type">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="id-number" class="form-label">ID Number</label>
                  <input type="number" class="form-input-field" placeholder="Enter ID number" name="id-number">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="issue-authority" class="form-label">
                     Issue Authority
                  </label>
                  <input type="text" class="form-input-field" placeholder="Enter Issue department" name="issue-authority">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="issue-date" class="form-label">Issue Date</label>
                  <input type="date" class="form-input-field" placeholder="Enter Issue date" name="issue-date">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="issue-state" class="form-label">Issue State</label>
                  <input type="text" class="form-input-field" placeholder="Enter Issue state" name="issue-state">
               </div>
               <div class="form-input-with-label-conatiner">
                  <label for="expiry-date" class="form-label">Expiry Date</label>
                  <input type="date" class="form-input-field" placeholder="Enter ID expiry date" name="expiry-date">
               </div>
            </div>
         </section>
         <button type="submit" class="submit-button">
            Next&nbsp;&nbsp;&nbsp;→
         </button>
      </div>
   </form>
</body>

</html>
